<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简介 | Your Name</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础样式 */
        :root {
            --primary-color: #2563eb;
            --text-color: #1f2937;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 卡片容器 */
        .card {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 头像 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e2e8f0;
            margin: 0 auto 1.5rem;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        h1 { margin: 0; font-size: 1.8rem; color: #111827; }
        p.tagline { color: var(--primary-color); font-weight: 500; margin: 0.5rem 0 1.5rem; }
        
        .bio {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 1.5rem;
        }

        /* 技能标签 */
        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }

        .skill-tag {
            background: #eff6ff;
            color: #3b82f6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #9ca3af;
            font-size: 1.5rem;
            transition: color 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--primary-color);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" alt="头像" class="avatar">
        
        <h1>你的名字</h1>
        <p class="tagline">产品经理 / 开发者 / 终身学习者</p>

        <div class="bio">
            <p>👋 你好！我是一名热衷于创造有趣事物的自由职业者。擅长利用技术解决生活中的小问题，喜欢摄影和旅行。</p>
        </div>

        <div class="skills">
            <span class="skill-tag">Python</span>
            <span class="skill-tag">UI Design</span>
            <span class="skill-tag">Product Management</span>
            <span class="skill-tag">English</span>
        </div>

        <div class="social-links">
            <a href="https://github.com/你的用户名" target="_blank"><i class="fab fa-github"></i></a>
            <a href="mailto:yourname@email.com"><i class="fas fa-envelope"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>

        <footer>
            &copy; 2024 Your Name. Powered by GitHub Pages.
        </footer>
    </div>

</body>
</html>
